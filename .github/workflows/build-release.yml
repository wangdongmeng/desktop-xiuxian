name: Build Desktop Xiuxian (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Full Paid Edition or Free Trial Demo Edition'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'demo'
      build_mac:
        description: 'Also build macOS .dmg installer'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove China mirror .npmrc on GitHub US runner
        shell: bash
        run: rm -f .npmrc

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer (.exe NSIS + Portable)
        env:
          VITE_DEMO_MODE: ${{ inputs.build_type == 'demo' && 'true' || 'false' }}
        run: npm run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xiuxian-windows-${{ inputs.build_type || 'full' }}
          path: |
            release/*.exe
            release/win-unpacked/**
          if-no-files-found: error

  build-macos:
    if: github.event_name == 'push' || inputs.build_mac == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Remove China mirror .npmrc on GitHub US runner
        run: rm -f .npmrc

      - name: Install dependencies
        run: npm install

      - name: Build macOS Installer (.dmg + .zip)
        run: npm run dist:mac

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-xiuxian-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
